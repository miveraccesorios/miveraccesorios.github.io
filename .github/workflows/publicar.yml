# Publica el sitio en GitHub Pages cada vez que se suben cambios a main.
# Solo se publican los archivos del sitio: el editor, el README y los scripts quedan afuera.
name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar carpeta del sitio
        run: |
          mkdir _sitio
          cp -r index.html catalogo.html producto.html 404.html favicon.svg css js assets _sitio/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
      - id: deploy
        uses: actions/deploy-pages@v4
