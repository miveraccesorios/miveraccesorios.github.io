<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo · Miver Accesorios</title>
  <meta name="description" content="Catálogo de Miver Accesorios: collares, pulseras y chokers tejidos a mano. Precios y pedidos por WhatsApp.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Catálogo · Miver Accesorios">
  <meta property="og:description" content="Collares, pulseras y chokers tejidos a mano. Precios y pedidos por WhatsApp.">
  <meta property="og:site_name" content="Miver Accesorios">
  <meta property="og:locale" content="es_AR">
  <meta property="og:url" content="https://miver.com.ar/catalogo.html">
  <meta property="og:image" content="https://miver.com.ar/assets/img/compartir.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Collares y pulseras tejidos a mano de Miver Accesorios">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#f7f2ec">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="catalogo">

  <main id="principal">
    <header class="cabecera-pagina contenedor">
      <span class="antetitulo">Tienda</span>
      <h1 id="titulo-catalogo">Catálogo</h1>
      <p>Todas nuestras piezas, tejidas a mano. Agregá tus favoritas al pedido y envialo por WhatsApp.</p>
    </header>

    <div class="filtros">
      <div class="contenedor filtros__fila">
        <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
        <div class="filtros__derecha">
          <div class="buscador">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            <label class="visualmente-oculto" for="busqueda">Buscar</label>
            <input id="busqueda" type="search" placeholder="Buscar…" autocomplete="off">
          </div>
          <div class="orden">
            <label class="visualmente-oculto" for="orden">Ordenar</label>
            <select id="orden">
              <option value="destacados">Destacados</option>
              <option value="precio-asc">Menor precio</option>
              <option value="precio-desc">Mayor precio</option>
              <option value="nombre">Nombre A-Z</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="contenedor">
      <p class="resultado-info" id="resultado-info" aria-live="polite"></p>
      <div class="grilla-productos" id="grilla"></div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
